<!-- Q4 -->
<div class="q-block">
  <div class="q-header">
    <div><div class="q-number">Question 4</div><div class="q-title">Pool analysis — flag, filter, sum, classify, compare, range</div></div>
    <span class="q-module-tag qmt-2">→ Module 3 + 4</span>
  </div>
  <div class="concept-row">
    <span class="concept-chip">ifelse()</span>
    <span class="concept-chip">new columns</span>
    <span class="concept-chip">tapply()</span>
    <span class="concept-chip">diff() + range()</span>
    <span class="concept-chip">multi-condition &amp;</span>
  </div>
  <div class="q-text">A 6-part question: create a pool indicator, filter to pool houses, total their prices, define "impressive" pools with 3 conditions, compare mean prices by pool quality, and find the year-built range of impressive-pool houses.</div>
  <button class="reveal-btn" onclick="toggleReveal('q4r')">▶ Show solution &amp; explanation</button>
  <div class="reveal-content" id="q4r">
    ${codeBlock('R', `<cm># 1. Binary pool indicator column</cm>
dat<op>$</op>has_pool <op>&lt;-</op> <fn>ifelse</fn>(dat<op>$</op>pool_area <op>&gt;</op> <num>0</num>, <num>1</num>, <num>0</num>)

<cm># 2. Filter to houses with pools</cm>
pools_only <op>&lt;-</op> <fn>subset</fn>(dat, pool_area <op>&gt;</op> <num>0</num>)

<cm># 3. Total sale price of pool houses</cm>
pools_only<op>$</op>sale_price <op>|&gt;</op> <fn>sum</fn>()

<cm># 4. "Impressive" pool: Good/Excellent quality AND ≥500 sqft AND ≥10% of living area</cm>
dat<op>$</op>impressive_pool <op>&lt;-</op> <fn>ifelse</fn>(
  (dat<op>$</op>pool_qc <op>==</op> <str>"Gd"</str> <op>|</op> dat<op>$</op>pool_qc <op>==</op> <str>"Ex"</str>) <op>&amp;</op>
    dat<op>$</op>pool_area <op>&gt;=</op> <num>500</num> <op>&amp;</op>
    dat<op>$</op>pool_area <op>&gt;=</op> (<num>0.10</num> <op>*</op> dat<op>$</op>gr_liv_area),
  <num>1</num>, <num>0</num>
)

<cm># 5. Mean sale price: impressive vs non-impressive pools</cm>
pools_only <op>&lt;-</op> <fn>subset</fn>(dat, pool_area <op>&gt;</op> <num>0</num>)
pools_only<op>$</op>sale_price <op>|&gt;</op> <fn>tapply</fn>(pools_only<op>$</op>impressive_pool, mean)

<cm># 6. Year-built range of impressive-pool houses</cm>
impressive_only <op>&lt;-</op> <fn>subset</fn>(dat, impressive_pool <op>==</op> <num>1</num>)
<fn>diff</fn>(<fn>range</fn>(impressive_only<op>$</op>year_built))
<cm># range() returns c(min, max); diff() computes max - min</cm>`)}
    <div class="insight-box">
      <strong>tapply(values, groups, function):</strong> Applies a function to values split by a grouping variable. <code>tapply(price, impressive_pool, mean)</code> = mean price for each value of impressive_pool (0 and 1).
      <br><br><strong>diff(range(x)):</strong> A compact idiom for <code>max(x) - min(x)</code>. <code>range(x)</code> = <code>c(min,max)</code>; <code>diff()</code> = second minus first.
      <br><br><strong>Multi-condition ifelse:</strong> Use <code>&</code> for AND, <code>|</code> for OR. Parentheses around the OR clause prevent operator precedence bugs.
    </div>
  </div>
</div>

<div class="q-block">

  <button class="reveal-btn" onclick="toggleReveal('q5r')">▶ Show solution &amp; explanation</button>

    ${codeBlock('R', `dat<op>$</op>score <op>&lt;-</op> <num>0</num>

<cm># +2 if garage ≥ 500 sqft</cm>
dat<op>$</op>score <op>&lt;-</op> dat<op>$</op>score <op>+</op> <fn>ifelse</fn>(dat<op>$</op>garage_area <op>&gt;=</op> <num>500</num>, <num>2</num>, <num>0</num>)

<cm># -2 if no garage at all</cm>

<cm># +1 for Good or Excellent kitchen</cm>
dat<op>$</op>score <op>&lt;-</op> dat<op>$</op>score <op>+</op> <fn>ifelse</fn>(dat<op>$</op>kitchen_qual <op>==</op> <str>"Gd"</str> <op>|</op> dat<op>$</op>kitchen_qual <op>==</op> <str>"Ex"</str>, <num>1</num>, <num>0</num>)

<cm># +1 if fence exists (not NA)</cm>
dat<op>$</op>score <op>&lt;-</op> dat<op>$</op>score <op>+</op> <fn>ifelse</fn>(<op>!</op><fn>is.na</fn>(dat<op>$</op>fence), <num>1</num>, <num>0</num>)

<cm># +2 if at least 1 basement full bath</cm>
dat<op>$</op>score <op>&lt;-</op> dat<op>$</op>score <op>+</op> <fn>ifelse</fn>(dat<op>$</op>bsmt_full_bath <op>&gt;=</op> <num>1</num>, <num>2</num>, <num>0</num>)

<cm># -3 if basement area = 0 (no basement)</cm>
dat<op>$</op>score <op>&lt;-</op> dat<op>$</op>score <op>+</op> <fn>ifelse</fn>(dat<op>$</op>total_bsmt_sf <op>==</op> <num>0</num>, <op>-</op><num>3</num>, <num>0</num>)

<cm># +1 if sale price ≤ $200,000</cm>
dat<op>$</op>score <op>&lt;-</op> dat<op>$</op>score <op>+</op> <fn>ifelse</fn>(dat<op>$</op>sale_price <op>&lt;=</op> <num>200000</num>, <num>1</num>, <num>0</num>)

max_score <op>&lt;-</op> <fn>max</fn>(dat<op>$</op>score)
<fn>sum</fn>(dat<op>$</op>score <op>==</op> max_score)  <cm># how many houses hit the max</cm>`)}
    <div class="insight-box">
      <strong>Pattern — cumulative ifelse scoring:</strong> Each line adds (or subtracts) to the same column. The right side always includes the current value of <code>dat$score</code> so points accumulate.
      <br><br><strong><code>!is.na(x)</code></strong> = "x is NOT missing". Used here to check if a fence exists (NA means no fence in this dataset).
      <br><br><strong><code>sum(dat$score == max_score)</code></strong> = count rows where score equals the maximum. This is the <code>mean(condition)</code> pattern from Q1, but for counting instead of proportions.

  </div>
</div>

<!-- Q6 -->
<div class="q-block">
  <div class="q-header">
    <div><div class="q-number">Question 6</div><div class="q-title">Do houses where garage spaces > bedrooms sell for more than average?</div></div>
    <span class="q-module-tag qmt-2">→ Module 3 + 4</span>
  </div>
  <div class="concept-row">
    <span class="concept-chip">column comparison</span>
    <span class="concept-chip">conditional subsetting</span>
    <span class="concept-chip">mean()</span>
  </div>
  <div class="q-text">Compare two columns against each other to create a logical filter, then compare the resulting mean against the overall mean.</div>
  <button class="reveal-btn" onclick="toggleReveal('q6r')">▶ Show solution &amp; explanation</button>
  <div class="reveal-content" id="q6r">
    ${codeBlock('R', `<cm># Mean price where garage_cars > bedroom_abv_gr (column vs column)</cm>
avg_price_garage <op>&lt;-</op> <fn>mean</fn>(dat<op>$</op>sale_price[dat<op>$</op>garage_cars <op>&gt;</op> dat<op>$</op>bedroom_abv_gr])

<cm># Overall mean price</cm>
avg_normal_price <op>&lt;-</op> <fn>mean</fn>(dat<op>$</op>sale_price)

avg_price_garage <op>&gt;</op> avg_normal_price   <cm># TRUE or FALSE</cm>`)}
    <div class="insight-box">
      <strong>Column vs column comparison:</strong> <code>dat$garage_cars > dat$bedroom_abv_gr</code> compares values row-by-row across two columns, producing a logical vector. This is then used inside <code>[]</code> to subset sale_price.
      <br><br>The syntax <code>mean(dat$sale_price[condition])</code> is base-R equivalent of dplyr's <code>filter() %>% summarise(mean(...))</code>.
    </div>
  </div>
</div>

<!-- Q7 -->
<div class="q-block">
  <div class="q-header">
    <div><div class="q-number">Question 7</div><div class="q-title">Recode the electrical system abbreviations to their full descriptions</div></div>
    <span class="q-module-tag qmt-1">→ Module 1 + 3</span>
  </div>
  <div class="concept-row">
    <span class="concept-chip">string replacement</span>
    <span class="concept-chip">logical subsetting ←</span>
    <span class="concept-chip">table()</span>
    <span class="concept-chip">column recoding</span>
  </div>
  <div class="q-text">Replace each short code in the electrical column with a full human-readable label using logical index assignment.</div>
  <button class="reveal-btn" onclick="toggleReveal('q7r')">▶ Show solution &amp; explanation</button>
  <div class="reveal-content" id="q7r">
    ${codeBlock('R', `<fn>table</fn>(dat<op>$</op>electrical)   <cm># before — see abbreviations</cm>

dat<op>$</op>electrical[dat<op>$</op>electrical <op>==</op> <str>"SBrkr"</str>] <op>&lt;-</op> <str>"Standard Circuit Breakers &amp; Romex"</str>
dat<op>$</op>electrical[dat<op>$</op>electrical <op>==</op> <str>"FuseA"</str>] <op>&lt;-</op> <str>"Fuse Box over 60 AMP and all Romex wiring (Average)"</str>
dat<op>$</op>electrical[dat<op>$</op>electrical <op>==</op> <str>"FuseF"</str>] <op>&lt;-</op> <str>"60 AMP Fuse Box and mostly Romex wiring (Fair)"</str>
dat<op>$</op>electrical[dat<op>$</op>electrical <op>==</op> <str>"FuseP"</str>] <op>&lt;-</op> <str>"60 AMP Fuse Box and mostly knob &amp; tube wiring (poor)"</str>
dat<op>$</op>electrical[dat<op>$</op>electrical <op>==</op> <str>"Mix"</str>]   <op>&lt;-</op> <str>"Mixed"</str>

<fn>table</fn>(dat<op>$</op>electrical)   <cm># after — full labels</cm>`)}
    <div class="insight-box">
      <strong>Pattern — index-assignment recoding:</strong> <code>vec[vec == "old"] &lt;- "new"</code> selects positions where the condition is TRUE and overwrites them. Repeat for each code. This is base-R recoding — dplyr's equivalent is <code>mutate(col = case_when(...))</code> (covered in Module 7).
    </div>
  </div>
</div>

<!-- Q8 -->
<div class="q-block">
  <div class="q-header">
    <div><div class="q-number">Question 8</div><div class="q-title">How many houses have missing masonry veneer area? What is the mean (excluding NAs)?</div></div>
    <span class="q-module-tag qmt-2">→ Module 4: EDA</span>
  </div>
  <div class="concept-row">
    <span class="concept-chip">is.na()</span>
    <span class="concept-chip">sum(is.na())</span>
    <span class="concept-chip">mean(na.rm=TRUE)</span>
    <span class="concept-chip">missing value handling</span>
  </div>
  <div class="q-text">Count the NAs, then compute the mean while ignoring them. This pattern appears in almost every real dataset.</div>
  <button class="reveal-btn" onclick="toggleReveal('q8r')">▶ Show solution &amp; explanation</button>
  <div class="reveal-content" id="q8r">
    ${codeBlock('R', `<cm># Count missing values</cm>
<fn>sum</fn>(<fn>is.na</fn>(dat<op>$</op>mas_vnr_area))

<cm># Mean excluding NAs</cm>
<fn>mean</fn>(dat<op>$</op>mas_vnr_area, na.rm <op>=</op> <kw>TRUE</kw>)`)}
    <div class="insight-box">
      <strong>Critical exam pattern:</strong> Without <code>na.rm = TRUE</code>, <code>mean()</code> returns NA if any value is missing. The same applies to <code>sum()</code>, <code>sd()</code>, <code>var()</code>, <code>median()</code>.
      <br><br><strong><code>sum(is.na(x))</code></strong> counts NAs: <code>is.na()</code> returns TRUE/FALSE, and <code>sum()</code> treats TRUE as 1. For a whole data frame: <code>colSums(is.na(dat))</code> gives the NA count per column.
    </div>
  </div>
</div>

<!-- Q9 -->
<div class="q-block">
  <div class="q-header">
    <div><div class="q-number">Question 9</div><div class="q-title">Filter houses with misc. features (excluding sheds) and export to CSV</div></div>
    <span class="q-module-tag qmt-3">→ Module 3 + 7</span>
  </div>
  <div class="concept-row">
    <span class="concept-chip">which()</span>
    <span class="concept-chip">!= (not equal)</span>
    <span class="concept-chip">multi-column select</span>
    <span class="concept-chip">write.csv()</span>
    <span class="concept-chip">getwd()</span>
  </div>
  <div class="q-text">Select rows where misc_val > 0 and the feature isn't a shed. Keep only 4 specific columns. Write to CSV and confirm the working directory.</div>
  <button class="reveal-btn" onclick="toggleReveal('q9r')">▶ Show solution &amp; explanation</button>
  <div class="reveal-content" id="q9r">
    ${codeBlock('R', `<cm># Count houses with any misc. value</cm>
<fn>sum</fn>(dat<op>$</op>misc_val <op>&gt;</op> <num>0</num>, na.rm <op>=</op> <kw>TRUE</kw>)
<fn>table</fn>(dat<op>$</op>misc_feature)

<cm># Filter: misc_val > 0 AND not a shed; select 4 columns</cm>
filtered_df <op>&lt;-</op> dat[<fn>which</fn>(dat<op>$</op>misc_val <op>&gt;</op> <num>0</num> <op>&amp;</op> dat<op>$</op>misc_feature <op>!=</op> <str>"Shed"</str>),
                    <fn>c</fn>(<str>"lot_area"</str>, <str>"sale_price"</str>, <str>"sale_type"</str>, <str>"yr_sold"</str>)]

<cm># Export to CSV (no row numbers)</cm>
<fn>write.csv</fn>(filtered_df, <str>"filtered_houses.csv"</str>, row.names <op>=</op> <kw>FALSE</kw>)

<cm># See where the file was saved</cm>
<fn>getwd</fn>()`)}
    <div class="insight-box">
      <strong><code>which(condition)</code></strong> returns the <em>integer positions</em> (row indices) where the condition is TRUE, instead of a logical vector. It's safer inside <code>df[, ]</code> because it skips NAs automatically — <code>df[NA, ]</code> would produce NA rows.
      <br><br><strong>Column selection by name vector:</strong> <code>df[rows, c("col1","col2")]</code> keeps only those columns — equivalent to dplyr's <code>select(col1, col2)</code>.
      <br><br><strong><code>write.csv(..., row.names = FALSE)</code></strong> — always include <code>row.names = FALSE</code> to avoid an ugly extra column of row numbers in your output file.
    </div>
  </div>
</div>

// ── FREE-TEXT EXERCISE CHECKER ───────────────────────────────────────────────
function checkFree(inputId, fbId) {
  const val = document.getElementById(inputId).value.trim().toLowerCase();
  const fb = document.getElementById(fbId);
  fb.classList.add('show');
  const hasAssign = val.includes('<-') || val.includes('=');
  const hasClass = val.includes('class(');
  const hasString = val.includes('"') || val.includes("'");
  if (hasAssign && hasClass && hasString) {
    fb.className = 'feedback correct-fb show';
    fb.textContent = '✅ Looks great! You used assignment (<-), created a character variable (quoted string), and checked types with class(). Well done!';
    markDone(currentModuleIdx);
  } else if (hasAssign && !hasClass) {
    fb.className = 'feedback wrong-fb show';
    fb.textContent = '⚠️ You created the variables — but did you add class(student_name), class(grade), class(passed) to check the types?';
  } else {
    fb.className = 'feedback wrong-fb show';
    fb.textContent = '⚠️ Make sure to use <- for assignment, put your name in quotes ("..."), and call class() on each variable.';
  }
}
